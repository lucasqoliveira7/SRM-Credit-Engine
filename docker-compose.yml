services:
  postgres:
    image: postgres:16
    container_name: srm-credit-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: srm_credit_engine
      POSTGRES_USER: srm_user
      POSTGRES_PASSWORD: srm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_user -d srm_credit_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: srm-credit-engine-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/srm_credit_engine
      SPRING_DATASOURCE_USERNAME: srm_user
      SPRING_DATASOURCE_PASSWORD: srm_password
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: srm-credit-engine-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data: